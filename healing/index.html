<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>心屿 · Soul Haven</title>
<meta name="description" content="心屿 —— 一座安放心灵的 3D 疗愈小岛：呼吸、放下、星语、风铃、冥想与生成式疗愈音乐。">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root{
  --ink:#f7efe7;
  --ink-dim:rgba(247,239,231,.66);
  --ink-faint:rgba(247,239,231,.38);
  --glass:rgba(16,18,36,.30);
  --line:rgba(255,236,228,.14);
  --line-strong:rgba(255,236,228,.28);
  --rose:#ffc4d8;
  --gold:#ffe1a6;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --latin:"Cormorant Garamond",Georgia,serif;
  --brush:"Ma Shan Zheng","STKaiti","KaiTi",cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#04050c;color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#scene{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:none;outline:none}
.ui{transition:opacity 1.4s ease, transform 1.4s ease}
body.pre .ui{opacity:0;pointer-events:none}
body.ui-hidden .ui,body.meditating .ui{opacity:0!important;pointer-events:none!important}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px) saturate(125%);-webkit-backdrop-filter:blur(16px) saturate(125%)}

#brand{position:fixed;top:26px;left:34px;pointer-events:none}
#brand .logo{font-family:var(--brush);font-size:44px;line-height:1;letter-spacing:.1em;text-shadow:0 0 26px rgba(255,180,215,.35)}
#brand .tag{font-family:var(--latin);font-style:italic;font-size:15px;letter-spacing:.24em;color:var(--ink-dim);margin-top:6px}
#brand .poem{font-size:12px;letter-spacing:.42em;color:var(--ink-faint);margin-top:14px;writing-mode:vertical-rl;height:9.5em;transition:opacity 1.6s ease}
#brand .count{font-size:12px;color:var(--ink-faint);margin-top:12px;letter-spacing:.16em;min-height:1em}

#topright{position:fixed;top:24px;right:28px;display:flex;gap:10px;align-items:center}
.seg{display:flex;padding:4px;border-radius:999px}
.seg button{font-size:13px;letter-spacing:.22em;padding:8px 14px 8px 17px;border-radius:999px;color:var(--ink-dim);transition:background .5s,color .5s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:rgba(255,255,255,.13);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink-dim);transition:color .4s,background .4s}
.iconbtn:hover{color:#fff;background:rgba(255,255,255,.08)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
#btn-mute .off{display:none}
#btn-mute.muted .on{display:none}
#btn-mute.muted .off{display:block}

#dock{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:flex;gap:4px;padding:8px;border-radius:28px}
#dock button{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;width:70px;padding:11px 0 9px;border-radius:20px;color:var(--ink-dim);font-size:12px;letter-spacing:.28em;text-indent:.28em;transition:background .5s,color .5s}
#dock button:hover{background:rgba(255,255,255,.07);color:var(--ink)}
#dock button.on{color:#fff;background:linear-gradient(180deg,rgba(255,190,215,.20),rgba(255,225,166,.07))}
#dock button.on::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--rose);box-shadow:0 0 8px var(--rose)}
#dock svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}

#hint{position:fixed;left:50%;bottom:124px;transform:translateX(-50%);font-size:13px;letter-spacing:.34em;color:var(--ink-dim);opacity:0;transition:opacity 1.6s ease;white-space:nowrap;text-shadow:0 1px 10px rgba(0,0,0,.55);pointer-events:none}
#hint.show{opacity:1}

#message{position:fixed;left:50%;top:27%;transform:translate(-50%,-50%);width:min(980px,92vw);text-align:center;pointer-events:none;z-index:5;transition:opacity 2.4s ease,filter 2.4s ease}
#message.out{opacity:0;filter:blur(8px)}
#message .zh{font-size:clamp(21px,2.7vw,34px);font-weight:300;letter-spacing:.24em;line-height:1.75;text-shadow:0 0 28px rgba(255,196,220,.5),0 2px 14px rgba(0,0,0,.5)}
#message .zh span{display:inline-block;opacity:0;filter:blur(10px);transform:translateY(10px);animation:charIn 2s cubic-bezier(.2,.7,.2,1) forwards}
#message .en{font-family:var(--latin);font-style:italic;font-size:clamp(15px,1.35vw,19px);letter-spacing:.07em;color:var(--ink-dim);margin-top:14px;opacity:0;transition:opacity 2.2s ease;text-shadow:0 1px 10px rgba(0,0,0,.55)}
#message .en.show{opacity:1}
@keyframes charIn{to{opacity:1;filter:blur(0);transform:none}}

.panel{position:fixed;left:50%;bottom:124px;transform:translate(-50%,14px);width:min(460px,calc(100vw - 32px));padding:26px 26px 22px;border-radius:24px;background:rgba(13,15,31,.55);border:1px solid var(--line);backdrop-filter:blur(24px) saturate(130%);-webkit-backdrop-filter:blur(24px) saturate(130%);opacity:0;pointer-events:none;transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);z-index:10;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.panel.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.panel h3{font-weight:400;font-size:19px;letter-spacing:.26em}
.panel .sub{font-size:13px;color:var(--ink-dim);letter-spacing:.1em;margin-top:8px;line-height:1.75}
.chips{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.chips button{flex:1 1 0;min-width:84px;padding:11px 8px;border-radius:14px;border:1px solid var(--line);color:var(--ink-dim);transition:all .4s;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:13px;letter-spacing:.12em}
.chips button b{font-weight:400}
.chips button small{font-family:var(--latin);font-size:13px;letter-spacing:.06em;opacity:.75}
.chips button:hover{border-color:var(--line-strong);color:var(--ink)}
.chips button.on{border-color:rgba(255,200,222,.55);color:#fff;background:rgba(255,190,215,.10)}
.desc{font-size:13px;color:var(--ink-faint);line-height:1.8;margin-top:14px;letter-spacing:.06em;min-height:3.6em}
.primary{display:block;margin:18px auto 0;padding:12px 40px 12px 46px;border-radius:999px;letter-spacing:.5em;font-size:14px;color:#24131c;background:linear-gradient(120deg,#ffd0e0,#ffe6b8);box-shadow:0 0 30px rgba(255,200,220,.35);transition:transform .4s,box-shadow .4s}
.primary:hover{transform:translateY(-1px);box-shadow:0 0 44px rgba(255,200,220,.55)}
.ghost{margin-top:16px;padding:7px 18px 7px 22px;border-radius:999px;border:1px solid var(--line);font-size:12px;letter-spacing:.4em;color:var(--ink-dim);transition:all .4s;pointer-events:auto}
.ghost:hover{color:#fff;border-color:var(--line-strong)}
textarea{display:block;width:100%;height:96px;margin-top:16px;padding:14px 16px;resize:none;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font:inherit;font-size:15px;line-height:1.7;letter-spacing:.08em;outline:none;transition:border-color .4s;user-select:text;-webkit-user-select:text}
textarea:focus{border-color:rgba(255,205,225,.45)}
textarea::placeholder{color:var(--ink-faint)}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
.note{font-size:11.5px;color:var(--ink-faint);letter-spacing:.06em;line-height:1.6}
.rowline .primary{margin:0;flex:none;padding:11px 26px 11px 32px;letter-spacing:.36em}
.mix{display:grid;grid-template-columns:1fr;gap:12px;margin-top:18px}
.mix label{display:grid;grid-template-columns:96px 1fr 34px;align-items:center;gap:12px;font-size:13px;letter-spacing:.16em;color:var(--ink-dim)}
.mix label em{font-style:normal;font-size:10.5px;color:var(--ink-faint);display:block;letter-spacing:.1em;margin-top:2px}
.mix output{font-family:var(--latin);font-size:14px;color:var(--ink-faint);text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,200,222,.8) 0 var(--p,50%),rgba(255,255,255,.14) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-5.5px;border-radius:50%;background:#fff;box-shadow:0 0 12px rgba(255,200,222,.9)}
input[type=range]::-moz-range-track{height:2px;background:rgba(255,255,255,.14)}
input[type=range]::-moz-range-progress{height:2px;background:rgba(255,200,222,.8)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 12px rgba(255,200,222,.9)}
.toggle{display:flex;align-items:center;gap:12px;margin-top:18px;font-size:13px;letter-spacing:.12em;color:var(--ink-dim);cursor:pointer}
.toggle input{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:999px;background:rgba(255,255,255,.14);position:relative;transition:background .4s;cursor:pointer;flex:none}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .4s}
.toggle input:checked{background:rgba(255,190,215,.6)}
.toggle input:checked::after{transform:translateX(14px)}

#breath-hud{position:fixed;left:50%;bottom:132px;transform:translateX(-50%);text-align:center;opacity:0;pointer-events:none;transition:opacity 1.2s ease;z-index:6}
#breath-hud.on{opacity:1}
#breath-hud.on .ghost{pointer-events:auto}
body.breathing #dock,body.breathing #hint{opacity:0;pointer-events:none;transform:translate(-50%,16px)}
body.breathing #breath-hud{bottom:34px}
#breath-phase{font-size:34px;font-weight:300;letter-spacing:.6em;text-indent:.6em;text-shadow:0 0 26px rgba(255,200,222,.55);transition:opacity .6s}
#breath-count{font-family:var(--latin);font-size:22px;color:var(--ink-dim);margin-top:2px;height:28px}
#breath-bar{width:240px;height:2px;margin:12px auto 0;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
#breath-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--gold));box-shadow:0 0 10px var(--rose)}
#breath-meta{font-size:12px;color:var(--ink-faint);letter-spacing:.3em;margin-top:12px}

#medit-hud{position:fixed;top:30px;left:50%;transform:translateX(-50%);text-align:center;opacity:0;pointer-events:none;transition:opacity 2s ease;z-index:6}
body.meditating #medit-hud{opacity:.75}
body.meditating #medit-hud .ghost{pointer-events:auto}
#medit-time{font-family:var(--latin);font-size:22px;letter-spacing:.2em;color:var(--ink-dim)}
#medit-hud .ghost{margin-top:8px;opacity:.6}

#exit-immerse{position:fixed;right:22px;bottom:22px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity 1s;color:var(--ink-dim);z-index:6}
body.ui-hidden #exit-immerse{opacity:.32;pointer-events:auto}
#exit-immerse:hover{opacity:.9}
#exit-immerse svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.4}

.fly{position:fixed;font-size:17px;color:#ffeedd;text-shadow:0 0 14px rgba(255,180,120,.95);pointer-events:none;z-index:40;transition:transform 2.8s cubic-bezier(.3,.6,.2,1),opacity 2.8s ease,filter 2.8s ease;will-change:transform}

#cursor{position:fixed;left:0;top:0;pointer-events:none;z-index:60;opacity:0;transition:opacity .4s}
#cursor.vis{opacity:1}
#cursor .dot{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;box-shadow:0 0 12px 3px rgba(255,210,230,.85)}
#cursor .ring{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:1px solid rgba(255,236,245,.42);transition:width .45s,height .45s,margin .45s,border-color .45s}
#cursor.hot .ring{width:58px;height:58px;margin:-29px 0 0 -29px;border-color:rgba(255,222,186,.85)}
#cursor .label{position:absolute;left:36px;top:-9px;font-size:12px;letter-spacing:.34em;white-space:nowrap;color:var(--ink);opacity:0;transition:opacity .45s;text-shadow:0 0 10px rgba(0,0,0,.6)}
#cursor.hot .label,#cursor.soft .label{opacity:.92}

#intro{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 55%,rgba(8,10,26,.05),rgba(3,4,10,.7) 80%);transition:opacity 2.8s ease}
#intro.gone{opacity:0;pointer-events:none}
.intro-kicker{font-family:var(--latin);font-size:13px;letter-spacing:.7em;text-indent:.7em;color:var(--ink-dim);opacity:0;animation:rise 2.4s .3s ease forwards}
.intro-title{font-family:var(--brush);font-weight:400;font-size:clamp(88px,13vw,156px);line-height:1.15;letter-spacing:.14em;text-indent:.14em;margin-top:6px;background:linear-gradient(180deg,#fff7f1 10%,#ffd3e2 60%,#ffd9a8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(255,180,215,.4));opacity:0;animation:rise 3s .6s ease forwards}
.intro-sub{font-size:15px;letter-spacing:.5em;text-indent:.5em;color:var(--ink-dim);opacity:0;animation:rise 2.4s 1.2s ease forwards;text-shadow:0 1px 12px rgba(0,0,0,.6)}
.enter-wrap{height:150px;display:grid;place-items:center;margin-top:30px}
.enter-btn{width:116px;height:116px;border-radius:50%;border:1px solid rgba(255,230,240,.36);background:radial-gradient(circle,rgba(255,200,225,.18),rgba(255,200,225,.02) 70%);color:var(--ink);font-size:16px;letter-spacing:.6em;text-indent:.6em;opacity:0;pointer-events:none;transition:opacity 1.6s ease,transform .6s ease;animation:breathe 6s ease-in-out infinite;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.enter-btn.ready{opacity:1;pointer-events:auto}
.enter-btn:hover{transform:scale(1.05)}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(255,200,225,0),0 0 28px rgba(255,200,225,.14)}50%{box-shadow:0 0 0 16px rgba(255,200,225,.05),0 0 64px rgba(255,200,225,.36)}}
@keyframes rise{from{opacity:0;transform:translateY(12px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
#loader{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:13px;letter-spacing:.4em;color:var(--ink-dim);transition:opacity 1s;white-space:nowrap}
#loader.done{opacity:0}
.intro-tips{margin-top:8px;font-size:12px;letter-spacing:.36em;color:var(--ink-faint);opacity:0;animation:rise 2.4s 1.8s ease forwards}

@media (max-width:700px){
  #brand{top:18px;left:18px}
  #brand .logo{font-size:34px}
  #brand .tag{font-size:13px}
  #brand .poem{display:none}
  #topright{top:16px;right:12px;gap:6px}
  .seg button{padding:7px 9px 7px 11px;font-size:12px;letter-spacing:.12em}
  #btn-full{display:none}
  #dock{bottom:14px;padding:6px;gap:0;max-width:calc(100vw - 16px)}
  #dock button{width:52px;font-size:11px;letter-spacing:.12em;text-indent:.12em;padding:9px 0 7px}
  #dock svg{width:20px;height:20px}
  .panel{bottom:96px}
  #hint{bottom:96px;font-size:12px;letter-spacing:.18em}
  #breath-hud{bottom:104px}
  .mix label{grid-template-columns:78px 1fr 30px}
}
@media (prefers-reduced-motion:reduce){ .enter-btn{animation:none} }
</style>
<script type="importmap">
{ "imports": {
  "three": "../vendor/three/build/three.module.js",
  "three/addons/": "../vendor/three/examples/jsm/"
} }
</script>
</head>
<body class="pre">
<canvas id="scene" aria-label="心屿 · 3D 疗愈场景"></canvas>

<div id="brand" class="ui">
  <div class="logo">心屿</div>
  <div class="tag">Soul Haven</div>
  <div class="count" id="lantern-count"></div>
  <div class="poem" id="poem"></div>
</div>

<div id="topright" class="ui">
  <div class="seg glass" id="presets">
    <button data-preset="dawn">晨曦</button>
    <button data-preset="dusk">暮霞</button>
    <button data-preset="night">星夜</button>
  </div>
  <button class="iconbtn glass" id="btn-mute" title="静音 (M)" aria-label="静音">
    <svg class="on" viewBox="0 0 24 24"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.7 7.7 0 0 1 0 11"/></svg>
    <svg class="off" viewBox="0 0 24 24"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
  </button>
  <button class="iconbtn glass" id="btn-full" title="全屏" aria-label="全屏">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
</div>

<div id="hint" class="ui"></div>
<div id="message" class="out"><div class="zh"></div><div class="en"></div></div>

<div id="breath-hud">
  <div id="breath-phase">吸气</div>
  <div id="breath-count"></div>
  <div id="breath-bar"><i></i></div>
  <div id="breath-meta"></div>
  <button class="ghost" id="breath-stop">结束</button>
</div>

<div id="medit-hud">
  <div id="medit-time">05:00</div>
  <button class="ghost" id="medit-stop">结束冥想</button>
</div>

<nav id="dock" class="ui glass" aria-label="疗愈功能">
  <button data-act="breath" title="呼吸 (空格)">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.6"/><circle cx="12" cy="12" r="6.4" opacity=".7"/><circle cx="12" cy="12" r="10.2" opacity=".35"/></svg><span>呼吸</span>
  </button>
  <button data-act="release" title="写下心事，放飞天灯">
    <svg viewBox="0 0 24 24"><path d="M8.2 4.5h7.6c1.6 2.6 2.4 5.3 2.2 8.2-.2 2.6-1.3 4.4-2.9 5.8H8.9C7.3 17.1 6.2 15.3 6 12.7c-.2-2.9.6-5.6 2.2-8.2z"/><path d="M9.6 21h4.8M12 13.4c-.9.8-.9 1.9 0 2.6.9-.7.9-1.8 0-2.6z"/></svg><span>放下</span>
  </button>
  <button data-act="whisper" title="收下一句星语">
    <svg viewBox="0 0 24 24"><path d="M12 3.2l1.9 5.6 5.7 1.7-5.7 1.8L12 18l-1.9-5.7-5.7-1.8 5.7-1.7z"/><path d="M18.5 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg><span>星语</span>
  </button>
  <button data-act="meditate" title="引导冥想">
    <svg viewBox="0 0 24 24"><path d="M12 19.5c-4.2 0-8-2.7-8.6-6.6 3.4-.1 6.7 2 8.6 6.6 1.9-4.6 5.2-6.7 8.6-6.6-.6 3.9-4.4 6.6-8.6 6.6z"/><path d="M12 19.5c-2.3-3.3-2.3-9.2 0-13.2 2.3 4 2.3 9.9 0 13.2z"/></svg><span>冥想</span>
  </button>
  <button data-act="sound" title="声景调音">
    <svg viewBox="0 0 24 24"><path d="M3.5 12h1.6M7.5 8.5v7M11.5 5v14M15.5 9v6M19.5 11v2"/></svg><span>声景</span>
  </button>
  <button data-act="immerse" title="沉浸 (H)">
    <svg viewBox="0 0 24 24"><path d="M2.5 12S6.2 5.5 12 5.5 21.5 12 21.5 12 17.8 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg><span>沉浸</span>
  </button>
</nav>

<section class="panel" id="panel-breath" aria-label="呼吸练习">
  <h3>跟随心灯，慢慢呼吸</h3>
  <p class="sub">吸气时心灯渐亮，整座小岛与你一同呼吸</p>
  <div class="chips" id="breath-chips">
    <button data-p="coh" class="on"><b>共振呼吸</b><small>5 · 5</small></button>
    <button data-p="478"><b>安眠呼吸</b><small>4 · 7 · 8</small></button>
    <button data-p="box"><b>方块呼吸</b><small>4 · 4 · 4 · 4</small></button>
  </div>
  <p class="desc" id="breath-desc"></p>
  <button class="primary" id="breath-go">开 始</button>
</section>

<section class="panel" id="panel-release" aria-label="放下心事">
  <h3>写下此刻压在心上的事</h3>
  <p class="sub">它会化作一盏天灯，带着那份重量，慢慢飞向星空</p>
  <textarea id="worry" maxlength="30" placeholder="比如：总担心自己做得不够好……"></textarea>
  <div class="rowline">
    <span class="note">文字只在你的屏幕上停留片刻<br>不会被保存，也不会被上传</span>
    <button class="primary" id="release-go">点 灯</button>
  </div>
</section>

<section class="panel" id="panel-meditate" aria-label="引导冥想">
  <h3>安住当下</h3>
  <p class="sub">界面会悄悄隐去，只留下湖光、星空，和一段温柔的引导。颂钵响起即开始，再次响起即结束。</p>
  <div class="chips" id="medit-chips">
    <button data-m="3"><b>3</b><small>minutes</small></button>
    <button data-m="5" class="on"><b>5</b><small>minutes</small></button>
    <button data-m="10"><b>10</b><small>minutes</small></button>
    <button data-m="15"><b>15</b><small>minutes</small></button>
  </div>
  <button class="primary" id="medit-go">开 始</button>
</section>

<section class="panel" id="panel-sound" aria-label="声景">
  <h3>声景 · Soundscape</h3>
  <p class="sub">实时生成的疗愈音乐，以 432Hz 调律，永不重复</p>
  <div class="mix">
    <label><span>总音量</span><input type="range" min="0" max="100" data-vol="master"><output></output></label>
    <label><span>疗愈音乐</span><input type="range" min="0" max="100" data-vol="music"><output></output></label>
    <label><span>湖浪</span><input type="range" min="0" max="100" data-vol="waves"><output></output></label>
    <label><span>晚风</span><input type="range" min="0" max="100" data-vol="wind"><output></output></label>
    <label><span>细雨</span><input type="range" min="0" max="100" data-vol="rain"><output></output></label>
    <label><span>虫鸣</span><input type="range" min="0" max="100" data-vol="crickets"><output></output></label>
    <label><span>θ 脑波<em>双耳节拍 · 需耳机</em></span><input type="range" min="0" max="100" data-vol="binaural"><output></output></label>
  </div>
  <label class="toggle"><input type="checkbox" id="auto-bowl"><span>颂钵 · 每隔片刻，轻敲一声</span></label>
</section>

<button id="exit-immerse" title="显示界面 (H)" aria-label="显示界面"><svg viewBox="0 0 24 24"><path d="M2.5 12S6.2 5.5 12 5.5 21.5 12 21.5 12 17.8 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg></button>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   helpers
   ===================================================================== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const PI2 = Math.PI * 2;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const easeInOutSine = t => -(Math.cos(Math.PI * t) - 1) / 2;
const easeInOutCubic = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const memStore = {};
const store = {
  get(k, d) {
    try { const v = localStorage.getItem(k); if (v != null) return JSON.parse(v); } catch (e) { }
    return k in memStore ? memStore[k] : d;
  },
  set(k, v) { memStore[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
};
function randDir(r = Math.random) { const u = r() * 2 - 1, a = r() * PI2, s = Math.sqrt(1 - u * u); return new THREE.Vector3(s * Math.cos(a), u, s * Math.sin(a)); }
function h3(x, y, z) { let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(z | 0, 1274126177); h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const L = (a, b, t) => a + (b - a) * t;
  return L(L(L(h3(xi, yi, zi), h3(xi + 1, yi, zi), u), L(h3(xi, yi + 1, zi), h3(xi + 1, yi + 1, zi), u), v),
    L(L(h3(xi, yi, zi + 1), h3(xi + 1, yi, zi + 1), u), L(h3(xi, yi + 1, zi + 1), h3(xi + 1, yi + 1, zi + 1), u), v), w);
}
function fbmJS(x, y, z, o = 4) { let s = 0, a = .5, f = 1; for (let i = 0; i < o; i++) { s += a * noise3(x * f + 11.3, y * f, z * f); f *= 2.03; a *= .5; } return s; }
const SHORE = a => 1 + 0.10 * Math.sin(3 * a + 1.0) + 0.06 * Math.sin(5 * a + 2.3) + 0.035 * Math.sin(8 * a + 0.4);

/* =====================================================================
   GLSL chunks
   ===================================================================== */
const NOISE = /* glsl */`
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float hash13(vec3 p3){ p3 = fract(p3 * 0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
vec3 hash33(vec3 p3){ p3 = fract(p3 * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yxz + 33.33); return fract((p3.xxy + p3.yxx) * p3.zyx); }
float vnoise(vec2 p){ vec2 i = floor(p); vec2 f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1.0, 0.0)), u.x), mix(hash12(i + vec2(0.0, 1.0)), hash12(i + vec2(1.0, 1.0)), u.x), u.y); }
float vnoise3(vec3 p){ vec3 i = floor(p); vec3 f = fract(p); vec3 u = f * f * (3.0 - 2.0 * f);
  float a = hash13(i), b = hash13(i + vec3(1.0, 0.0, 0.0)), c = hash13(i + vec3(0.0, 1.0, 0.0)), d = hash13(i + vec3(1.0, 1.0, 0.0));
  float e = hash13(i + vec3(0.0, 0.0, 1.0)), f1 = hash13(i + vec3(1.0, 0.0, 1.0)), g = hash13(i + vec3(0.0, 1.0, 1.0)), h = hash13(i + vec3(1.0, 1.0, 1.0));
  return mix(mix(mix(a, b, u.x), mix(c, d, u.x), u.y), mix(mix(e, f1, u.x), mix(g, h, u.x), u.y), u.z); }
float fbm2(vec2 p){ float v = 0.0, a = 0.5; mat2 m = mat2(1.6, 1.2, -1.2, 1.6); for (int i = 0; i < 5; i++){ v += a * vnoise(p); p = m * p; a *= 0.5; } return v; }
float fbm3(vec3 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 4; i++){ v += a * vnoise3(p); p = p * 2.03 + vec3(1.7, 9.2, 3.1); a *= 0.5; } return v; }
`;
const QUAD_VS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;

/* =====================================================================
   presets  (晨曦 / 暮霞 / 星夜)
   ===================================================================== */
const C = h => new THREE.Color(h);
const V = (x, y, z) => new THREE.Vector3(x, y, z).normalize();
const PRESETS = {
  night: {
    skyTop: C('#02040d'), skyMid: C('#0a1531'), skyHorizon: C('#22356a'),
    sunColor: C('#dbe5ff'), sunDir: V(0.42, 0.21, -1), sunSize: 1.0, sunGlow: 0.85, sunKind: 0,
    stars: 1, aurora: 1, milky: 1,
    cloud: 0.5, cloudLit: C('#7f93c8'), cloudDark: C('#070d1f'),
    fog: C('#1b2a55'), ink: C('#03060f'), mist: 0.55, mistColor: C('#2e4078'), lakeFog: 0.75,
    water: C('#01030a'), glitter: 1.0, rippleColor: C('#86eaff'), shore: 1,
    hemiSky: C('#4a5ba6'), hemiGround: C('#05060b'), hemiInt: 0.6,
    dirColor: C('#a6b8ff'), dirInt: 0.7,
    canopyLight: C('#ff7cb9'), canopyInt: 42,
    canopyTint: C('#ffffff'), canopyBright: 1.0, occ: 0,
    vein: 0.85, veinCol: C('#ff8fc6'),
    grassBase: C('#04060d'), grassTip: C('#2a4670'),
    petalA: C('#ff9cc6'), petalB: C('#ffe6f0'), petalBright: 0.55,
    fireflies: 1, skyLanterns: 1, bokeh: 1, rays: 1.0, rayTh: 0.6,
    gShadow: C('#2a3c8a'), gHigh: C('#ffd2b0'), sat: 1.06, contrast: 1.05,
    bloom: 0.72, bloomTh: 0.62, exposure: 0.95, key: 50
  },
  dusk: {
    skyTop: C('#16194a'), skyMid: C('#6c4a8e'), skyHorizon: C('#ffa07c'),
    sunColor: C('#ffd2a0'), sunDir: V(0.34, 0.045, -1), sunSize: 1.55, sunGlow: 1.6, sunKind: 1,
    stars: 0.28, aurora: 0, milky: 0,
    cloud: 0.88, cloudLit: C('#ffb38a'), cloudDark: C('#3c2456'),
    fog: C('#c98299'), ink: C('#22143a'), mist: 0.6, mistColor: C('#e6a2ad'), lakeFog: 0.9,
    water: C('#120a22'), glitter: 1.5, rippleColor: C('#ffd2ad'), shore: 0.25,
    hemiSky: C('#b07ab4'), hemiGround: C('#1a0d18'), hemiInt: 0.85,
    dirColor: C('#ffb38c'), dirInt: 1.3,
    canopyLight: C('#ff9a8f'), canopyInt: 30,
    canopyTint: C('#ffdcc8'), canopyBright: 0.85, occ: 0.4,
    vein: 0.5, veinCol: C('#ffb08a'),
    grassBase: C('#120814'), grassTip: C('#8a5064'),
    petalA: C('#ffc0c8'), petalB: C('#fff0e2'), petalBright: 0.8,
    fireflies: 0.55, skyLanterns: 0.85, bokeh: 0.85, rays: 1.2, rayTh: 0.95,
    gShadow: C('#4a2266'), gHigh: C('#ffc890'), sat: 1.1, contrast: 1.04,
    bloom: 0.62, bloomTh: 0.78, exposure: 0.95, key: 53
  },
  dawn: {
    skyTop: C('#3f72b8'), skyMid: C('#aab5e2'), skyHorizon: C('#ffdcbd'),
    sunColor: C('#fff3dc'), sunDir: V(0.30, 0.10, -1), sunSize: 1.15, sunGlow: 0.8, sunKind: 1,
    stars: 0, aurora: 0, milky: 0,
    cloud: 0.72, cloudLit: C('#fff6ee'), cloudDark: C('#9aa5d4'),
    fog: C('#d9c4d6'), ink: C('#4d5a88'), mist: 0.85, mistColor: C('#f4dfe3'), lakeFog: 1.2,
    water: C('#33476e'), glitter: 1.0, rippleColor: C('#ffffff'), shore: 0,
    hemiSky: C('#cad8ff'), hemiGround: C('#3a3240'), hemiInt: 1.25,
    dirColor: C('#fff0d8'), dirInt: 1.9,
    canopyLight: C('#ffc2da'), canopyInt: 14,
    canopyTint: C('#ffd6e6'), canopyBright: 0.8, occ: 0.9,
    vein: 0.12, veinCol: C('#ffc8dc'),
    grassBase: C('#1b2432'), grassTip: C('#7d9a8c'),
    petalA: C('#ffd2e4'), petalB: C('#ffffff'), petalBright: 0.85,
    fireflies: 0.12, skyLanterns: 0.25, bokeh: 0.6, rays: 0.55, rayTh: 1.7,
    gShadow: C('#55649e'), gHigh: C('#fff0d8'), sat: 1.0, contrast: 1.0,
    bloom: 0.45, bloomTh: 0.92, exposure: 0.92, key: 55
  }
};
const POEMS = { night: '月照平湖 · 心归此处', dusk: '晚霞入湖 · 风也慢了', dawn: '晨雾初开 · 万物温柔' };
function clonePreset(p) { const o = {}; for (const k in p) o[k] = (p[k] && p[k].clone) ? p[k].clone() : p[k]; return o; }
let presetName = store.get('sh.preset', 'night');
if (!PRESETS[presetName]) presetName = 'night';
const S = clonePreset(PRESETS[presetName]);
function blendPreset(dt) {
  const T = PRESETS[presetName];
  const k = 1 - Math.exp(-dt * 0.6);
  for (const key in T) {
    if (key === 'key') continue;
    const a = S[key], b = T[key];
    if (a && a.isColor) a.lerp(b, k);
    else if (a && a.isVector3) a.lerp(b, k).normalize();
    else S[key] = a + (b - a) * k;
  }
}

/* =====================================================================
   renderer / scene / camera / post
   ===================================================================== */
const canvas = $('#scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
} catch (e) {
  $('#loader').textContent = '你的浏览器暂不支持 WebGL2，小岛无法展开';
  throw e;
}
const Q = { pr: Math.min(window.devicePixelRatio || 1, 1.5), refl: 0.5, level: 2 };
renderer.setPixelRatio(Q.pr);
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 3000);
scene.add(camera);
const shared = { uTime: { value: 0 }, uViewScale: { value: 900 } };

const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
/* crepuscular rays — light shafts streaming from the moon / sun through clouds & ridges */
const godRays = new ShaderPass({
  uniforms: {
    tDiffuse: { value: null }, uLight: { value: new THREE.Vector2(0.5, 0.5) }, uOn: { value: 0 }, uStrength: { value: 2.5 },
    uAspect: { value: 1 }, uThresh: { value: 0.28 }, uTint: { value: new THREE.Color() }, uStreak: { value: 0.1 }
  },
  vertexShader: QUAD_VS,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform vec2 uLight; uniform float uOn, uStrength, uAspect, uThresh, uStreak; uniform vec3 uTint;
    varying vec2 vUv;
    float h12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
    void main(){
      vec3 base = texture2D(tDiffuse, vUv).rgb;
      if (!(base.r == base.r && base.g == base.g && base.b == base.b)) base = vec3(0.0);
      base = clamp(base, 0.0, 64.0);
      if (uOn < 0.002){ gl_FragColor = vec4(base, 1.0); return; }
      vec2 toL = uLight - vUv;
      vec2 st = toL / 40.0 * 0.92;
      vec2 uv = vUv + st * h12(gl_FragCoord.xy);
      float decay = 1.0; vec3 acc = vec3(0.0);
      for (int i = 0; i < 40; i++){
        uv += st;
        vec3 s = clamp(texture2D(tDiffuse, uv).rgb, 0.0, 64.0);
        float l = dot(s, vec3(0.2126, 0.7152, 0.0722));
        float w = smoothstep(0.13, 0.0, length((uv - uLight) * vec2(uAspect, 1.0)));
        acc += s * max(l - uThresh, 0.0) * w * decay;
        decay *= 0.968;
      }
      acc /= 40.0;
      float dl = length(toL * vec2(uAspect, 1.0));
      vec3 col = base + acc * uStrength * exp(-dl * 1.6) * uOn;
      vec2 q = (vUv - uLight) * vec2(uAspect, 1.0);
      col += uTint * exp(-abs(q.y) * 240.0) * exp(-abs(q.x) * 2.4) * uStreak * uOn;
      gl_FragColor = vec4(col, 1.0);
    }`
});
composer.addPass(godRays);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.7, 0.42, 0.62);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const finalPass = new ShaderPass({
  uniforms: {
    tDiffuse: { value: null }, uTime: { value: 0 }, uVignette: { value: 0.55 }, uGrain: { value: 0.028 }, uFade: { value: 1 },
    uShadow: { value: new THREE.Color() }, uHigh: { value: new THREE.Color() }, uSat: { value: 1 }, uContrast: { value: 1 }
  },
  vertexShader: QUAD_VS,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform float uTime, uVignette, uGrain, uFade, uSat, uContrast; uniform vec3 uShadow, uHigh;
    varying vec2 vUv;
    float h12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
    void main(){
      vec2 c = vUv - 0.5;
      float r2 = dot(c, c);
      vec2 off = c * r2 * 0.014;
      vec3 col;
      col.r = texture2D(tDiffuse, vUv + off).r;
      col.g = texture2D(tDiffuse, vUv).g;
      col.b = texture2D(tDiffuse, vUv - off).b;
      float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
      col = mix(vec3(l), col, uSat);
      col = (col - 0.5) * uContrast + 0.5;
      col += uShadow * (1.0 - smoothstep(0.0, 0.42, l)) * 0.05 + uHigh * smoothstep(0.55, 1.0, l) * 0.04;
      col = max(col, 0.0);
      float vig = smoothstep(0.95, 0.22, length(c * vec2(1.0, 1.18)));
      col *= mix(1.0, vig, uVignette);
      col += (h12(gl_FragCoord.xy + fract(uTime * 7.31) * 113.0) - 0.5) * uGrain;
      col *= 1.0 - uFade;
      gl_FragColor = vec4(col, 1.0);
    }`
});
composer.addPass(finalPass);

/* =====================================================================
   sky dome — gradient, moon/sun disc, lit clouds, halo, stars, milky way, aurora
   ===================================================================== */
const skyMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: shared.uTime, uTop: { value: S.skyTop }, uMid: { value: S.skyMid }, uHorizon: { value: S.skyHorizon },
    uSunColor: { value: S.sunColor }, uSunDir: { value: S.sunDir }, uStars: { value: 1 }, uAurora: { value: 1 },
    uMilky: { value: 1 }, uSunGlow: { value: 1 }, uAudio: { value: 0 }, uBreath: { value: 0 },
    uSunSize: { value: 1 }, uSunKind: { value: 0 }, uMoonPulse: { value: 0 },
    uCloud: { value: 0.5 }, uCloudLit: { value: S.cloudLit }, uCloudDark: { value: S.cloudDark }
  },
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform float uTime, uStars, uAurora, uMilky, uSunGlow, uAudio, uBreath, uSunSize, uSunKind, uMoonPulse, uCloud;
    uniform vec3 uTop, uMid, uHorizon, uSunColor, uSunDir, uCloudLit, uCloudDark;
    varying vec3 vDir;
    ${NOISE}
    vec3 starLayer(vec3 d, float scale, float thr, float size){
      vec3 p = d * scale;
      vec3 id = floor(p);
      vec3 f = fract(p) - 0.5;
      float h = hash13(id);
      if (h < thr) return vec3(0.0);
      vec3 off = (hash33(id) - 0.5) * 0.4;
      float dist = length(f - off);
      float r = fract(h * 97.31);
      float tw = 0.62 + 0.38 * sin(uTime * (0.6 + r * 2.6) + h * 91.0);
      float b = smoothstep(size, 0.0, dist);
      b = b * b * (3.0 - 2.0 * b);
      vec3 col = mix(vec3(0.72, 0.8, 1.0), vec3(1.0, 0.86, 0.72), fract(h * 17.7));
      return col * b * tw * (0.9 + r * 3.4);
    }
    vec3 aurora(vec3 d){
      if (d.y < 0.01) return vec3(0.0);
      vec3 acc = vec3(0.0);
      for (int i = 0; i < 18; i++){
        float fi = float(i);
        float pt = (0.9 + fi * 0.05) / (d.y * 1.5 + 0.1);
        vec2 p = d.xz * pt;
        float n1 = vnoise(vec2(p.x * 0.5 + uTime * 0.012, p.y * 0.32));
        float n2 = vnoise(vec2(p.x * 1.5 - uTime * 0.02, p.y * 1.1 + 4.0));
        float band = abs(sin(p.y * 1.2 + n1 * 5.2 + n2 * 1.3 + uTime * 0.025));
        float rays = 0.55 + 0.45 * vnoise(vec2(p.x * 7.0 + uTime * 0.05, fi * 0.15));
        float c = pow(max(1.0 - band, 0.0), 10.0) * (0.3 + n2) * rays;
        vec3 col = mix(vec3(0.16, 1.0, 0.68), vec3(0.6, 0.32, 1.0), smoothstep(0.0, 17.0, fi));
        acc += col * c * exp(-fi * 0.1);

      float facing = smoothstep(0.35, -0.55, d.z);

    void main(){
      vec3 d = normalize(vDir);
      float h = d.y;
      float hp = max(h, 0.0);
      vec3 col = mix(uHorizon, uMid, smoothstep(0.0, 0.2, pow(hp, 0.85)));
      col = mix(col, uTop, smoothstep(0.12, 0.72, hp));
      col = mix(col, uHorizon * 0.55, smoothstep(0.0, -0.15, h));
      vec3 sd3 = normalize(uSunDir);
      float sd = max(dot(d, sd3), 0.0);
      float chord = length(d - sd3);
      col += uSunColor * (pow(sd, 8.0) * 0.035 + pow(sd, 70.0) * 0.1 + pow(sd, 500.0) * 0.45) * uSunGlow * (1.0 + uMoonPulse);

      col += vec3(0.75, 0.82, 1.0) * exp(-pow((chord - 0.385) * 36.0, 2.0)) * 0.026 * (1.0 - uSunKind) * uSunGlow;

      float sm = uStars * smoothstep(-0.02, 0.2, h);
      if (sm > 0.001){
        vec3 st = starLayer(d, 140.0, 0.93, 0.34) + starLayer(d, 60.0, 0.982, 0.24) * 1.6;
        vec3 bn = normalize(vec3(0.35, 0.55, 0.76));
        float bd = dot(d, bn);
        float band = exp(-bd * bd * 22.0);
        float neb = fbm3(d * 3.2 + 2.0);
        float neb2 = fbm3(d * 8.0 + 7.0);
        vec3 mw = mix(vec3(0.32, 0.22, 0.55), vec3(0.18, 0.42, 0.72), neb) * band * smoothstep(0.3, 0.75, neb * 0.75 + neb2 * 0.45);
        mw *= 1.0 - smoothstep(0.5, 0.68, neb2) * 0.7;
        st += starLayer(d, 340.0, 0.86, 0.32) * band * 0.9 * uMilky;
        float wash = 1.0 - smoothstep(0.86, 0.997, sd) * 0.92;
        extra += (st * sm * (1.0 + uAudio * 0.5 + uBreath * 0.4) + mw * 0.32 * uMilky * sm) * wash;
      }
      if (uAurora > 0.001) extra += aurora(d) * uAurora * (1.0 + uAudio * 0.4);

      // moon / sun disc
      float R = 0.0234 * uSunSize;
      float disc = smoothstep(R, R * 0.92, chord);
      vec3 discCol = vec3(0.0);
      if (disc > 0.0){
        vec3 up0 = abs(sd3.y) > 0.95 ? vec3(1.0, 0.0, 0.0) : vec3(0.0, 1.0, 0.0);
        vec3 rgt = normalize(cross(up0, sd3)); vec3 upv = cross(sd3, rgt);
        vec2 sp = vec2(dot(d - sd3, rgt), dot(d - sd3, upv)) / R;
        float limb = sqrt(max(0.0, 1.0 - dot(sp, sp)));
        float maria = fbm2(sp * 1.7 + 3.0);
        float crater = vnoise(sp * 9.0 + 1.3);
        vec3 moonC = uSunColor * (0.66 + 0.34 * smoothstep(0.3, 0.72, maria)) * (0.84 + 0.16 * crater) * (0.6 + 0.4 * limb) * 1.05;
        vec3 sunC = uSunColor * vec3(1.0, 0.93 + limb * 0.07, 0.82 + limb * 0.18) * 1.9;
        discCol = mix(moonC, sunC, uSunKind) * (1.0 + uMoonPulse * 1.2) * disc;

      float ca = 0.0; vec3 cc = vec3(0.0);

        float n = fbm2(cp * 0.42 + wind);

        dens *= smoothstep(0.0, 0.05, h) * (1.0 - 0.55 * smoothstep(0.35, 0.9, h));

      col = mix(col + discCol, cc, ca);
      col += (hash12(gl_FragCoord.xy + fract(uTime) * 61.0) - 0.5) / 255.0;

    }`,
  side: THREE.BackSide, depthWrite: false

const MAX_RIPPLES = 16, TRAIL = 20;
const WATER_SHADER = {
  name: 'SoulLake',
  uniforms: {
    color: { value: null }, tDiffuse: { value: null }, textureMatrix: { value: null },
    uTime: { value: 0 }, uWaterColor: { value: new THREE.Color() }, uSunDir: { value: new THREE.Vector3() },
    uSunColor: { value: new THREE.Color() }, uFog: { value: new THREE.Color() }, uRippleColor: { value: new THREE.Color() },
    uRipples: { value: Array.from({ length: MAX_RIPPLES }, () => new THREE.Vector4(0, 0, -100, 0)) },
    uTrail: { value: Array.from({ length: TRAIL }, () => new THREE.Vector4(0, 0, -100, 0)) },
    uOrb: { value: new THREE.Vector4(0, 0, 1, 0) },
    uIsland: { value: new THREE.Vector4(ISL.x, ISL.z, ISL_RX * SHORE_K, ISL_RZ * SHORE_K) },
    uRain: { value: 0 }, uGlitter: { value: 1 }, uShore: { value: 1 }, uBreath: { value: 0 }

    uniform vec4 uRipples[MAX_RIPPLES];
    uniform vec4 uTrail[TRAIL];
    uniform vec4 uOrb, uIsland;
    varying vec4 vUvR; varying vec3 vWorld;
    ${NOISE}
    float hField(vec2 p){
      float t = uTime;

           + vnoise(p * 0.42 + vec2(-t * 0.05, t * 0.045)) * 0.45
           + vnoise(p * 1.05 + vec2(t * 0.09, -t * 0.07)) * 0.2

    vec2 rainRip(vec2 p){
      vec2 g = vec2(0.0);
      for (int k = 0; k < 2; k++){
        float fk = float(k);

        vec2 id = floor(q); vec2 f = fract(q) - 0.5;
        float h = hash12(id + fk * 3.7);
        vec2 c = (vec2(hash12(id + 5.1), hash12(id + 9.7)) - 0.5) * 0.36;
        float t = fract(uTime * (0.55 + h * 0.6) + h * 7.0);
        vec2 dl = f - c; float d = length(dl) + 1e-4;
        float x = d - t * 0.42;

    float shoreFn(float a){ return 1.0 + 0.10 * sin(3.0 * a + 1.0) + 0.06 * sin(5.0 * a + 2.3) + 0.035 * sin(8.0 * a + 0.4); }
    void main(){
      vec2 p = vWorld.xz;
      vec3 toCam = cameraPosition - vWorld;
      float dist = length(toCam);
      vec3 v = toCam / dist;
      float e = 0.1;
      vec2 grad = vec2(hField(p + vec2(e, 0.0)) - hField(p - vec2(e, 0.0)), hField(p + vec2(0.0, e)) - hField(p - vec2(0.0, e))) / (2.0 * e);

        vec4 r = uRipples[i];

        vec2 dl = p - r.xy;

        float env = exp(-x * x * 0.8) * exp(-age * 0.38) * r.w * smoothstep(0.0, 0.25, age);

        vec2 dl = p - r.xy;

      }
      if (uShore > 0.001){

        float sd = length(q) / shoreFn(atan(q.y, q.x));
        float band = exp(-max(sd - 1.0, 0.0) * 7.0) * smoothstep(0.86, 1.0, sd);
        float tw = vnoise(p * 2.6 + vec2(uTime * 0.25, -uTime * 0.18));

        col += uRippleColor * band * (0.05 + sp * 0.85) * uShore * (1.0 + uBreath * 0.8);
      }
      float fog = 1.0 - exp(-dist * 0.0022);
      col = mix(col, uFog * 0.75, fog * 0.55);
      gl_FragColor = vec4(col, 1.0);
    }`

  drag.down = false;
  const wasPlay = drag.mode === 'play';
  drag.active = false; drag.mode = null;
  if (quick && e.type === 'pointerup') interact(pickAt(e.clientX, e.clientY), e.clientX, e.clientY);
  if (wasPlay) updateHover();
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => { if (!started) return; lastInput = time; cam.tDist *= 1 + Math.sign(e.deltaY) * 0.09; }, { passive: true });
document.addEventListener('pointermove', e => {
  const onCanvas = e.target === canvas && e.pointerType !== 'touch';
  cursorEl.classList.toggle('vis', onCanvas && started);
  cDot.style.transform = `translate(${e.clientX}px,${e.clientY}px)`;
});
canvas.addEventListener('pointerleave', () => { cursorEl.classList.remove('vis'); attract.active = false; pointer.inside = false; });
window.addEventListener('keydown', e => {
  if (!started || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  lastInput = time;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); if (breath.active) breath.stop(false); else { closePanels(); breath.start(breathPattern); } }
  else if (k === 'h') setImmersive(!document.body.classList.contains('ui-hidden'));
  else if (k === 'm') { audio.setMuted(!audio.muted); muteBtn.classList.toggle('muted', audio.muted); }
  else if (k === '1') setPreset('dawn'); else if (k === '2') setPreset('dusk'); else if (k === '3') setPreset('night');
  else if (k === 'escape') { if (openPanel) closePanels(); else if (breath.active) breath.stop(false); else if (medit.active) medit.stop(false); else setImmersive(false); }
});

/* =====================================================================
   resize / quality
   ===================================================================== */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(Q.pr);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 1 ? 58 : 48;
  camera.updateProjectionMatrix();
  composer.setPixelRatio(Q.pr); composer.setSize(w, h);
  water.getRenderTarget().setSize(Math.max(2, Math.round(w * Q.pr * Q.refl)), Math.max(2, Math.round(h * Q.pr * Q.refl)));
  const db = renderer.getDrawingBufferSize(new THREE.Vector2());
  shared.uViewScale.value = db.y / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  godRays.uniforms.uAspect.value = w / h;
}
window.addEventListener('resize', resize);
resize();
const perf = { acc: 0, n: 0, checks: 0 };
function adaptQuality(dt) {
  if (!started || perf.checks > 6) return;
  perf.acc += dt; perf.n++;
  if (perf.acc > 2.5) {
    const avg = perf.acc / perf.n; perf.acc = 0; perf.n = 0; perf.checks++;
    if (avg > 1 / 38 && Q.level > 0) {
      Q.level--;
      if (Q.level === 1) { Q.pr = Math.max(1, Q.pr * 0.8); Q.refl = 0.4; }
      else { Q.pr = 1; Q.refl = 0.33; skyMat.uniforms.uAurora.value = 0; }
      resize();
    }
  }
}

/* =====================================================================
   main loop
   ===================================================================== */
let time = 0, started = false, moonPulse = 0, gust = 0;
const clock = new THREE.Clock();
const _g = new THREE.Vector3();
function frame() {
  const raw = clock.getDelta();
  const dt = Math.min(raw, 0.05);
  const rdt = Math.min(raw, 0.25);
  time += dt;
  shared.uTime.value = time;
  WU.uTime.value = time;
  finalPass.uniforms.uTime.value = time;
  finalPass.uniforms.uFade.value = Math.max(0, finalPass.uniforms.uFade.value - dt * 0.5);

  blendPreset(dt);
  const lvl = audio.updateLevel();
  const ambientBreath = 0.5 + 0.5 * Math.sin(time * PI2 / 10);

  breath.update(rdt);
  medit.update(rdt);
  updateCamera(dt);
  camera.updateMatrixWorld();

  // sky
  sky.position.copy(camera.position);
  const su = skyMat.uniforms;
  su.uStars.value = S.stars;
  if (Q.level > 0) su.uAurora.value = S.aurora;
  su.uMilky.value = S.milky;
  su.uSunGlow.value = S.sunGlow * (1 + moonPulse * 0.5);
  su.uAudio.value = lvl; su.uBreath.value = breath.value;
  su.uSunSize.value = S.sunSize; su.uSunKind.value = S.sunKind; su.uMoonPulse.value = moonPulse; su.uCloud.value = S.cloud;
  moonPulse *= Math.exp(-dt * 0.9);

  // god rays from the moon / sun
  _g.copy(camera.position).addScaledVector(S.sunDir, 800).project(camera);
  const ox = Math.max(Math.abs(_g.x) - 1, 0), oy = Math.max(Math.abs(_g.y) - 1, 0);
  const gr = godRays.uniforms;
  gr.uOn.value = (_g.z < 1 && Q.level > 0) ? Math.exp(-(ox + oy) * 2.5) : 0;
  gr.uLight.value.set(_g.x * 0.5 + 0.5, _g.y * 0.5 + 0.5);
  gr.uStrength.value = S.rays * (3.2 + moonPulse * 3.0);
  gr.uTint.value.copy(S.sunColor);
  gr.uThresh.value = S.rayTh;
  gr.uStreak.value = 0.05 + S.sunKind * 0.05;

  // mountains & mist
  for (const m of mountainMats) { m.mat.uniforms.uColor.value.copy(S.ink).lerp(S.fog, m.k); m.mat.uniforms.uMist.value = S.mist; }
  for (const m of mistMeshes) {
    m.material.uniforms.uOpacity.value = S.mist * m.userData.o;
    m.rotation.y = Math.atan2(camera.position.x - m.position.x, camera.position.z - m.position.z);
  }
  for (const f of fogLayers) {
    f.m.position.x = camera.position.x; f.m.position.z = camera.position.z - 80;
    f.m.material.uniforms.uOpacity.value = f.base * S.lakeFog;
    f.m.visible = Q.level > 0;
  }

  // water
  WU.uWaterColor.value.copy(S.water); WU.uSunDir.value.copy(S.sunDir); WU.uSunColor.value.copy(S.sunColor);
  WU.uFog.value.copy(S.fog); WU.uRippleColor.value.copy(S.rippleColor);
  WU.uGlitter.value = S.glitter; WU.uShore.value = S.shore; WU.uBreath.value = breath.value;
  WU.uRain.value += (audio.vol.rain - WU.uRain.value) * (1 - Math.exp(-dt));
  rainU.uRain.value = WU.uRain.value; rain.visible = WU.uRain.value > 0.01;
  rainU.uCenter.value.set(camera.position.x * 0.5, 0, camera.position.z * 0.5 - 12);

  // lights
  hemi.color.copy(S.hemiSky); hemi.groundColor.copy(S.hemiGround); hemi.intensity = S.hemiInt;
  dirLight.color.copy(S.dirColor); dirLight.intensity = S.dirInt; dirLight.position.copy(S.sunDir).multiplyScalar(60);
  canopyLight.color.copy(S.canopyLight);
  const pulseAge = time - canopyU.uPulseT.value;
  canopyLight.intensity = S.canopyInt * (0.9 + ambientBreath * 0.12 + breath.value * 0.5 + Math.exp(-Math.max(pulseAge, 0) * 0.8) * 1.2);

  // cursor ray → canopy & grass respond to touch
  if (pointer.inside && started) {
    const r = setRay(pointer.x, pointer.y);
    canopyU.uRayO.value.copy(r.origin).sub(treeGroup.position); canopyU.uRayD.value.copy(r.direction);
    grassU.uRayO.value.copy(r.origin); grassU.uRayD.value.copy(r.direction);
  }
  canopyU.uRayOn.value += ((pointer.inside && started && !drag.active ? 1 : 0) - canopyU.uRayOn.value) * (1 - Math.exp(-dt * 3));

  // tree, grass, petals, particles
  gust *= Math.exp(-dt * 0.45);
  canopyU.uBright.value = S.canopyBright * (0.93 + ambientBreath * 0.1);
  canopyU.uOcc.value = S.occ;
  canopyU.uBreath.value = breath.value;
  canopyU.uAudio.value = lvl;
  canopyU.uWind.value = 0.35 + 0.25 * Math.sin(time * 0.13) + gust * 1.5;
  barkU.uVein.value = S.vein * (0.85 + ambientBreath * 0.3);
  grassU.uLightInt.value = canopyLight.intensity / 40;
  grassU.uGlowTip.value = S.shore;
  petalU.uGust.value = gust; petalU.uBright.value = S.petalBright;
  ff.intensity.value = S.fireflies;
  mossIntensity.value = 0.25 + S.shore * 0.75;
  moteU.uIntensity.value = 0.2 + S.fireflies * 0.8;
  skyLanternU.uIntensity.value = S.skyLanterns;
  bokehU.uIntensity.value = S.bokeh;
  wishU.uVis.value = 0.35 + S.stars * 0.65;

  if (attract.active && time - attract.lastMove > 4) attract.active = false;
  attract.w += ((attract.active ? 1 : 0) - attract.w) * (1 - Math.exp(-dt * 1.5));
  updateFireflies(dt, time);
  updateLotus(dt, time);
  updateChimes(dt);
  updateLanterns(dt);
  sparks.update(dt, time);
  updateShooting(dt);
  if (started && presetName === 'night' && Math.random() < dt / 22) launchShootingStar();

  // post
  bloom.strength = S.bloom * (0.92 + breath.value * 0.25 + lvl * 0.15);
  bloom.threshold = S.bloomTh;
  renderer.toneMappingExposure = S.exposure;
  const fu = finalPass.uniforms;
  fu.uShadow.value.copy(S.gShadow); fu.uHigh.value.copy(S.gHigh); fu.uSat.value = S.sat; fu.uContrast.value = S.contrast;

  ringPos.x += (pointer.x - ringPos.x) * (1 - Math.exp(-dt * 12));
  ringPos.y += (pointer.y - ringPos.y) * (1 - Math.exp(-dt * 12));
  cRing.style.transform = `translate(${ringPos.x}px,${ringPos.y}px)`;
  cLabel.style.transform = `translate(${ringPos.x}px,${ringPos.y}px)`;
  pointer.speed *= Math.exp(-dt * 4);

  adaptQuality(dt);
  composer.render(dt);
  requestAnimationFrame(frame);
}

/* =====================================================================
   boot
   ===================================================================== */
async function boot() {
  try { if (renderer.compileAsync) await renderer.compileAsync(scene, camera); } catch (e) { }
  if (document.fonts && document.fonts.load) document.fonts.load('80px "Ma Shan Zheng"', '心屿放下').catch(() => { });
  window.__soulReady = true;
  clearTimeout(window.__bootTimer);
  $('#loader').classList.add('done');
  $('#enter').classList.add('ready');
}
$('#enter').addEventListener('click', () => {
  if (started) return;
  started = true;
  lastInput = time;
  audio.init();
  $('#intro').classList.add('gone');
  document.body.classList.remove('pre');
  cam.intro = { t: 0, dur: 11, from: { theta: cam.theta, phi: cam.phi, dist: cam.dist, lift: cam.lift }, to: { theta: 0, phi: 0.02, dist: 30 } };
  setTimeout(() => { if (audio.ctx) audio.bowl(mtof(audio.key - 12), 0.2, 0, 14); }, 600);
  setTimeout(() => showMessage('欢迎来到心屿。在这里，你什么都不用做。', 'Welcome to Soul Haven. Here, there is nothing you need to do.', 7000), 5200);
  setTimeout(runHints, 15000);
});
requestAnimationFrame(frame);
boot();
if (/[?&]hq\b/.test(location.search)) perf.checks = 99;
window.__soul = { scene, camera, renderer, S, audio, breath, medit, setPreset, interact, pickAt, spawnLantern, launchShootingStar, Q, perf, cam, flyingLanterns, chimes, strikeChime };
</script>
</body>
</html>
